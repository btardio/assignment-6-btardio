name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
      full-test:
        container:
          image: cuaesd/aesd-autotest:24-assignment6
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
            with:
              ref: yocto
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run full test
            run: ./full-test.sh

